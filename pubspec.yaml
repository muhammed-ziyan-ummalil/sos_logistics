name: sossss_logistics
description: "SOSSSS Logistics — Driver App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  sos_auth:
    path: ../packages/sos_auth
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_bloc: ^9.1.1
  equatable:
  dio: ^5.8.0+1
  pretty_dio_logger:
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  fluttertoast:
  fl_chart: ^0.69.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4
  google_maps_flutter: ^2.9.0
  flutter_google_places_sdk: ^0.4.3
  # Push notifications — FCM
  # Run `flutterfire configure --project=sos-6b1be` to generate
  # android/app/google-services.json and update lib/firebase_options.dart,
  # then `flutter pub get` again.
  firebase_core:
  firebase_messaging:
  flutter_local_notifications:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  image: assets/images/logo.png
  color: "#000B18"
  ios: false
  web: false
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#000B18"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
